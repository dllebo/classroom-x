name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager -type f || true
            exit 1
          fi

          # Feed a finite number of affirmative responses. Avoid a yes(1)
          # pipeline, which exits with SIGPIPE after sdkmanager stops reading.
          LICENSE_INPUT="$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --licenses <<< "$LICENSE_INPUT"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Bootstrap the wrapper until the generated wrapper files are committed.
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.5.0

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: classroom-x-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
